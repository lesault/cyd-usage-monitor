[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    ; Display driver: ILI9341_2 works on the author's ESP32-2432S028. If colours are wrong
    ; or the screen is garbled on yours, try -DST7789_DRIVER=1 (some boards also need
    ; -DTFT_INVERSION_ON=1). Pins below are the standard CYD wiring.
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Claude-style look (warm palette, spark mark, "Claude" wordmark), for personal use:
;   pio run -e cyd-claude -t upload
; UNOFFICIAL: not affiliated with or endorsed by Anthropic. The device labels itself as
; such at boot and in Settings. The default `cyd` environment above is deliberately neutral.
[env:cyd-claude]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DBRAND_CLAUDE=1
